services:
  - type: web
    name: rehyn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: rehyn
      - key: REHYN_TRIAL_ACCESS_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TTS_VOICE
        value: nova
      - key: TTS_MODEL
        value: tts-1
      - key: ALIRA_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: ALIRA_REALTIME_VOICE
        value: marin
      - key: LOCAL_GPU_WORKER_URL
        sync: false
      - key: LOCAL_BACKEND_CALLBACK_URL
        value: https://rehyn.onrender.com/api
      - key: ANALYSIS_WORKER_TOKEN
        sync: false
      - key: ANALYSIS_WORKER_CF_CLIENT_ID
        sync: false
      - key: ANALYSIS_WORKER_CF_CLIENT_SECRET
        sync: false
      - key: CLINICAL_REVIEW_APPROVER_IDS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
